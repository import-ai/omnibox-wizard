[project]
name = "omnibox-wizard"
version = "0.1.20"
description = "OmniBox Wizard"
authors = [
    { name = "Lucien Shui", email = "lucien@lucien.ink" }
]
license = { text = "Apache License 2.0" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-common @ git+https://github.com/import-ai/python-common.git@80c3d0916b8b450d8a7793f21455fcca0deb6d9f",
    "wizard-common @ git+https://github.com/import-ai/wizard-common.git@84d10cb49cc874224a9b0efe1bcd5bef11580e98",
    "pydantic (>=2.11.3,<3.0.0)",
    "fastapi (>=0.121.0,<0.129.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "shortuuid (>=1.0.13,<2.0.0)",
    "openai>=2.7.2,<3.0.0",
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "langchain (>=0.3.24,<0.4.0)",
    "readability-lxml (>=0.8.4.1,<0.9.0.0)",
    "html2text (>=2025.4.15,<2026.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "sse-starlette (>=3.0.2,<4.0.0)",
    "opentelemetry-api (>=1.36.0,<2.0.0)",
    "opentelemetry-sdk (>=1.36.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.57b0,<0.58)",
    "opentelemetry-instrumentation-httpx (>=0.57b0,<0.58)",
    "opentelemetry-exporter-otlp (>=1.36.0,<2.0.0)",
    "python-frontmatter (>=1.1.0,<2.0.0)",
    "htmlmin (>=0.1.12,<0.2.0)",
    "weaviate-client (>=4.20.4,<5.0.0)",
    "anyascii (>=0.3.3,<0.4.0)",
    "pypinyin (>=0.55.0,<0.56.0)",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "testcontainers>=4.13.3",
    "python-dotenv>=1.2.1",
    "httpx-sse>=0.4.3",
    "pandas>=2.3.3",
    "pre-commit>=4.5.0",
    "ruff>=0.15.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
